name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/xcbeautify
          key: brew-${{ runner.os }}-xcodegen-xcbeautify-v1
          restore-keys: |
            brew-${{ runner.os }}-xcodegen-xcbeautify-

      - name: Install dependencies
        run: |
          brew install xcodegen xcbeautify || true
          brew link --overwrite xcodegen xcbeautify 2>/dev/null || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint — no UserDefaults.standard in production code
        run: |
          # Production settings must go through Settings' injectable store so
          # tests stay isolated (P1). EyeHealthAnalyzer is a known exception
          # pending an injectable store (P3.1). Comments are ignored.
          matches=$(grep -rn "UserDefaults\.standard" Blink Shared BlinkWatch --include="*.swift" \
            | grep -v "EyeHealthAnalyzer.swift" \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*//" || true)
          if [ -n "$matches" ]; then
            echo "::error::UserDefaults.standard used in production code — route through Settings' injectable store."
            echo "$matches"
            exit 1
          fi
          echo "OK: no disallowed UserDefaults.standard usage."

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Blink.xcodeproj \
            -scheme Blink \
            -destination 'platform=macOS' \
            -only-testing:BlinkTests \
            -resultBundlePath build/TestResults-Unit.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Report code coverage
        if: always()
        run: |
          if [ -d build/TestResults-Unit.xcresult ]; then
            echo "### Code coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets build/TestResults-Unit.xcresult >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Print overall % to the log for the (future P5) ratchet to parse.
            xcrun xccov view --report --only-targets build/TestResults-Unit.xcresult || true
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/TestResults-Unit.xcresult
          retention-days: 14
