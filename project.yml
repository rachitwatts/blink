name: Blink
options:
  bundleIdPrefix: com.rachitwatts
  deploymentTarget:
    macOS: "14.0"
    watchOS: "10.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Blink:
    type: application
    platform: macOS
    sources:
      - Blink
      - Shared
    settings:
      PRODUCT_NAME: Blink
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.blink
      INFOPLIST_FILE: Blink/Info.plist
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "13"
      MARKETING_VERSION: "2.6.4"
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: 87AMBUKU99
      PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - sdk: AppIntents.framework
      - package: Sparkle

  BlinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BlinkTests
    dependencies:
      - target: Blink
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.BlinkTests
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      GENERATE_INFOPLIST_FILE: YES

  BlinkWatch:
    type: application
    platform: watchOS
    sources:
      - BlinkWatch
      - Shared
    settings:
      PRODUCT_NAME: BlinkWatch
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.blink.watch
      INFOPLIST_FILE: BlinkWatch/Info.plist
      SWIFT_VERSION: "5.9"
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      GENERATE_INFOPLIST_FILE: NO
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      CODE_SIGN_ENTITLEMENTS: BlinkWatch/BlinkWatch.entitlements

  BlinkWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - BlinkWatchTests
    dependencies:
      - target: BlinkWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.BlinkWatchTests
      SWIFT_VERSION: "5.9"
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      GENERATE_INFOPLIST_FILE: YES

schemes:
  Blink:
    build:
      targets:
        Blink: all
    test:
      # Code coverage gathered for the app target (P0.2).
      gatherCoverageData: true
      coverageTargets:
        - Blink
      targets:
        # Randomized order now that the isolation foundation (BlinkTestCase +
        # per-test UserDefaults suite) is in place — surfaces any remaining
        # order-dependence (P1.6).
        - name: BlinkTests
          randomExecutionOrder: true
  BlinkWatch:
    build:
      targets:
        BlinkWatch: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - BlinkWatch
      targets:
        - name: BlinkWatchTests
          randomExecutionOrder: true
