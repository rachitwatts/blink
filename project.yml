name: Blink
options:
  bundleIdPrefix: com.rachitwatts
  deploymentTarget:
    macOS: "14.0"
    watchOS: "10.0"

targets:
  Blink:
    type: application
    platform: macOS
    sources:
      - Blink
      - Shared
    settings:
      PRODUCT_NAME: Blink
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.blink
      INFOPLIST_FILE: Blink/Info.plist
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.9.0"
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: Blink/Blink.entitlements
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - sdk: AppIntents.framework

  BlinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BlinkTests
    dependencies:
      - target: Blink
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.BlinkTests
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      GENERATE_INFOPLIST_FILE: YES

  BlinkWatch:
    type: application
    platform: watchOS
    sources:
      - BlinkWatch
      - Shared
    settings:
      PRODUCT_NAME: BlinkWatch
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.blink.watch
      INFOPLIST_FILE: BlinkWatch/Info.plist
      SWIFT_VERSION: "5.9"
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      GENERATE_INFOPLIST_FILE: NO
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      CODE_SIGN_ENTITLEMENTS: BlinkWatch/BlinkWatch.entitlements

  BlinkWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - BlinkWatchTests
    dependencies:
      - target: BlinkWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.BlinkWatchTests
      SWIFT_VERSION: "5.9"
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      GENERATE_INFOPLIST_FILE: YES

schemes:
  Blink:
    build:
      targets:
        Blink: all
    test:
      targets:
        - BlinkTests
  BlinkWatch:
    build:
      targets:
        BlinkWatch: all
    test:
      targets:
        - BlinkWatchTests
