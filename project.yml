name: Blink
options:
  bundleIdPrefix: com.rachitwatts
  deploymentTarget:
    macOS: "14.0"
    visionOS: "2.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Blink:
    type: application
    platform: macOS
    sources:
      - Blink
      - Shared
    settings:
      PRODUCT_NAME: Blink
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.blink
      INFOPLIST_FILE: Blink/Info.plist
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "15"
      MARKETING_VERSION: "2.7.0"
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: 87AMBUKU99
      PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - sdk: AppIntents.framework
      - package: Sparkle

  BlinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BlinkTests
    dependencies:
      - target: Blink
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rachitwatts.BlinkTests
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      GENERATE_INFOPLIST_FILE: YES

  BlinkVision:
    type: application
    platform: visionOS
    sources:
      - BlinkVision
      - path: Blink/Services
        excludes:
          - "BlinkActions.swift"
          - "BlinkIntents.swift"
          - "HotkeyManager.swift"
          - "LaunchAtLoginManager.swift"
          - "ScreenLockService.swift"
          - "ScriptCommands.swift"
          - "UpdaterService.swift"
          - "WeeklySummaryService.swift"
      - path: Blink/Models
      - Shared
    settings:
      PRODUCT_NAME: BlinkVision
      PRODUCT_BUNDLE_IDENTIFIER: com.watts.blinkvision
      INFOPLIST_FILE: BlinkVision/Info.plist
      SWIFT_VERSION: "5.9"
      XROS_DEPLOYMENT_TARGET: "2.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "15"
      MARKETING_VERSION: "2.7.0"
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: 87AMBUKU99
      CODE_SIGN_ENTITLEMENTS: BlinkVision/BlinkVision.entitlements

schemes:
  BlinkVision:
    build:
      targets:
        BlinkVision: all
  Blink:
    build:
      targets:
        Blink: all
    test:
      # Code coverage gathered for the app target (P0.2).
      gatherCoverageData: true
      coverageTargets:
        - Blink
      targets:
        # Randomized order now that the isolation foundation (BlinkTestCase +
        # per-test UserDefaults suite) is in place — surfaces any remaining
        # order-dependence (P1.6).
        - name: BlinkTests
          randomExecutionOrder: true
